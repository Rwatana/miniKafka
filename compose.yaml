services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: minikafka
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d minikafka"]
      interval: 5s
      timeout: 5s
      retries: 10

  broker:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/minikafka
      DATA_DIR: /data
      PORT: "5000"
    ports:
      - "5000:5000"
    volumes:
      - partition-logs:/data
    restart: unless-stopped

volumes:
  postgres-data:
  partition-logs:
