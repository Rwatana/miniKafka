name: Go test

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Detect Go module
        id: module
        run: if [[ -f go.mod ]]; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi
      - name: Set up Go
        if: steps.module.outputs.exists == 'true'
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Run Go tests
        if: steps.module.outputs.exists == 'true'
        run: go test ./...
