name: Pull Request closes Issue

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  closing-reference:
    runs-on: ubuntu-latest
    steps:
      - name: Validate closing keyword
        env:
          HEAD_REF: ${{ github.head_ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if [[ ! "$HEAD_REF" =~ ^feature/#([0-9]+)_[a-z0-9]+(_[a-z0-9]+)*$ ]]; then
            echo "Cannot determine Issue number from branch name."
            exit 1
          fi
          issue_number="${BASH_REMATCH[1]}"
          if ! grep -Eq "(Closes|Fixes|Resolves)[[:space:]]+#${issue_number}([^0-9]|$)" <<< "$PR_BODY"; then
            echo "PR body must close Issue #${issue_number}."
            exit 1
          fi
